spring:
  application:
    name: trading-gym-backend
  datasource:
    # 로컬 Postgres(brew, trust auth) 기준 기본값. 다른 환경에서는 DB_USERNAME/DB_PASSWORD로 덮어쓸 것.
    url: jdbc:postgresql://localhost:5432/trading_gym_dev
    username: ${DB_USERNAME:ksjhbrc}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # 마이그레이션 도구(Flyway 등) 없이 엔티티 기준으로 테이블을 맞추는 하커톤용 설정.
      # db/schema.sql의 users 테이블 정의와 형태를 맞춰뒀지만, 실제 소유자는 이 설정임.
      ddl-auto: update

server:
  # 8080/8081/8090은 이 맥북에서 다른 프로젝트가 이미 쓰고 있어서 8079로 고정.
  port: 8079

jwt:
  # 개발용 기본값. 실제 배포 시 반드시 환경변수(JWT_SECRET)로 덮어쓸 것 — HS256이라 최소 32바이트 필요.
  secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-before-any-real-deployment-please}
  access-token-validity-seconds: 900       # 15분
  refresh-token-validity-seconds: 1209600  # 14일

ai:
  # stub(기본값, 키 불필요) | anthropic | openai | gemini | codex-cli — 어댑터 선택.
  # anthropic/openai/gemini는 아래 각 provider의 api-key가 채워지면 바로 전환됨.
  # codex-cli는 API 키 대신 로컬에 설치된 `codex` CLI(ChatGPT 로그인 기반, API 과금과 무관)를
  # 서브프로세스로 호출함 — PATH에 codex가 있고 `codex login`이 돼있어야 함.
  provider: ${AI_PROVIDER:stub}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}

education:
  search:
    # edu-rag-indexer/web_search.py가 떠 있는 주소. 임베딩 모델이 파이썬 전용 라이브러리라
    # 별도 프로세스로 돌리고 여기선 HTTP로만 호출함 — 꺼져있으면 근거 자료 없이 채팅함
    # (EducationSearchClient가 예외를 삼키고 빈 리스트를 돌려줌).
    base-url: ${EDUCATION_SEARCH_URL:http://localhost:8123}
