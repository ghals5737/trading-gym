<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: transparent;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script src="three_bundle.min.js"></script>
<script>
(async function() {
  const THREE = window.THREE;
  const GLTFLoader = THREE.GLTFLoader;
  const canvas = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: true,
    preserveDrawingBuffer: true,
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(28, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0.7, 4.3);
  camera.lookAt(0, 0.05, 0);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x4a4136, 1.25));
  const key = new THREE.DirectionalLight(0xfff1dc, 2.4);
  key.position.set(3.5, 5, 4);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x4fceac, 0.9);
  rim.position.set(-4, 2.8, -3);
  scene.add(rim);

  const loader = new GLTFLoader();
  const texLoader = new THREE.TextureLoader();
  function loadGltf(url) {
    return new Promise((resolve, reject) => loader.load(url, resolve, undefined, reject));
  }
  function loadTexture(url, colorSpace) {
    const texture = texLoader.load(url);
    texture.colorSpace = colorSpace || THREE.NoColorSpace;
    texture.flipY = false;
    return texture;
  }
  function sanitizeClip(clip) {
    const clean = clip.clone();
    clean.tracks = clean.tracks.filter((track) => {
      const name = track.name;
      if (name.endsWith('.scale')) return false;
      if (name.endsWith('.position')) return false;
      if (/RootNode|KnowerBot|Sphere\.013/.test(name)) return false;
      return true;
    });
    clean.resetDuration();
    return clean;
  }

  const [modelGltf, sittingGltf] = await Promise.all([
    loadGltf('assets/swimming_knowerbot.glb'),
    loadGltf('assets/sitting.glb'),
  ]);

  const model = modelGltf.scene;
  model.updateMatrixWorld(true);
  const initialBox = new THREE.Box3().setFromObject(model);
  const initialSize = new THREE.Vector3();
  initialBox.getSize(initialSize);
  model.scale.setScalar(1.85 / Math.max(initialSize.y, 1));
  model.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(model);
  const center = new THREE.Vector3();
  box.getCenter(center);
  model.position.x -= center.x;
  model.position.z -= center.z;
  model.position.y += -0.92 - box.min.y;

  const maps = {
    map: loadTexture('assets/KnowerBot_Albedo.png', THREE.SRGBColorSpace),
    normalMap: loadTexture('assets/KnowerBot_Normal.png'),
    metalnessMap: loadTexture('assets/KnowerBot_Metalness.png'),
    roughnessMap: loadTexture('assets/KnowerBot_Roughness.png'),
    emissiveMap: loadTexture('assets/KnowerBot_Emission.png', THREE.SRGBColorSpace),
  };
  model.traverse((n) => {
    if (!n.isMesh) return;
    n.material = new THREE.MeshStandardMaterial({
      ...maps,
      emissive: 0xffffff,
      emissiveIntensity: 0.5,
      metalness: 0.85,
      roughness: 0.55,
    });
  });

  const rig = new THREE.Group();
  rig.rotation.y = 0.18;
  rig.add(model);
  scene.add(rig);

  const mixer = new THREE.AnimationMixer(model);
  const clip = sanitizeClip(sittingGltf.animations[0]);
  const action = mixer.clipAction(clip);
  action.play();
  mixer.setTime(Math.min(1.1, clip.duration * 0.68));

  renderer.render(scene, camera);
  window.__ready = true;
})();
</script>
</body>
</html>
